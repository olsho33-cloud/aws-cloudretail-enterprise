# ==============================================================================
# 파일명: .github/workflows/deploy.yml
# 설명: Enterprise Multi-AZ 3-Tier GitOps CI/CD Pipeline
# ==============================================================================

name: "Enterprise GitOps CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Deploy Infrastructure & Application"
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. AWS OIDC Role 인증 (영구 Access Key 없이 STS 임시 자격 증명 사용)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 3. 테라폼 CLI 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # 4. 테라폼 초기화, 검증 및 자동 배포
      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform validate
          terraform apply -auto-approve

      # 5. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 & ECR 푸시 (app 디렉터리가 있을 경우)
      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cloudretail-ent-prod-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -d "app" ]; then
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          else
            echo "app 디렉터리가 없으므로 인프라 프로비저닝 단계를 완료합니다."
          fi
